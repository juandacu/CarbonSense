<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>EXIOBASE Dashboard</title>
  <style>
    :root { --frame-h: 980px; }
    body { margin:0; padding:16px; font-family: Arial, sans-serif; background:#fff; }
    .tabs { display:flex; gap:8px; margin-bottom:12px; }
    .tab-btn {
      border: 1px solid #d0d0d0;
      background: #f7f7f7;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 14px;
    }
    .tab-btn.active { background:#fff; }
    .panel { display:none; }
    .panel.active { display:block; }

    /* All tabs share the exact same iframe height */
    iframe { width:100%; height: var(--frame-h); border:0; display:block; }
  </style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" data-tab="p1">GVA & Employment</button>
    <button class="tab-btn" data-tab="p2">Emissions</button>
    <button class="tab-btn" data-tab="p3">Emissions intensity (kg CO2e/EUR)</button>
  </div>

  <div id="p1" class="panel active">
    <iframe id="frame1" scrolling="no"></iframe>
  </div>

  <div id="p2" class="panel">
    <iframe id="frame2" scrolling="no"></iframe>
  </div>

  <div id="p3" class="panel">
    <iframe id="frame3" scrolling="no"></iframe>
  </div>

  <script>
    const f1 = document.getElementById("frame1");
    const f2 = document.getElementById("frame2");
    const f3 = document.getElementById("frame3");

    const SRC1 = "es_gva_employment.html";
    const SRC2 = "es_emissions_by_scope.html";
    const SRC3 = "es_intensity_abs_stacked.html";

    f1.src = SRC1;

    const btns = document.querySelectorAll(".tab-btn");
    const panels = document.querySelectorAll(".panel");

    // Standardize: pick ONE height for all tabs.
    // Option A (simplest): fixed height only
    const FIXED_H = 980;

    // Option B: clamp to max of reported heights (still standardized across tabs)
    const USE_MAX_REPORTED = true;
    const MIN_H = 980;
    const MAX_H = 1300;

    const reported = { frame1: 0, frame2: 0, frame3: 0 };

    function setAllHeights(px) {
      const h = Math.max(MIN_H, Math.min(MAX_H, px|0));
      document.documentElement.style.setProperty("--frame-h", h + "px");
      // forward to outer parent (article) so it can resize the outer iframe too
      window.parent.postMessage({ type: "plot-size", height: h + 80 }, "*");
    }

    // Initial standardized height
    setAllHeights(FIXED_H);

    function requestSize(ifr) {
      try { ifr.contentWindow.postMessage({ type: "request-size" }, "*"); } catch (_) {}
      try { ifr.contentWindow.postMessage({ type: "force-resize" }, "*"); } catch (_) {}
    }

    // Receive inner plot heights, but enforce same height for all tabs
    window.addEventListener("message", function (e) {
      const d = e.data || {};
      if (d.type !== "plot-size") return;

      const h = Number(d.height);
      if (!Number.isFinite(h) || h < 200) return;

      // Identify which inner iframe sent it
      if (f1.contentWindow === e.source) reported.frame1 = h;
      if (f2.contentWindow === e.source) reported.frame2 = h;
      if (f3.contentWindow === e.source) reported.frame3 = h;

      if (USE_MAX_REPORTED) {
        const maxH = Math.max(reported.frame1, reported.frame2, reported.frame3, MIN_H);
        setAllHeights(maxH);
      } else {
        setAllHeights(FIXED_H);
      }
    });

    function activate(id) {
      panels.forEach(p => p.classList.toggle("active", p.id === id));
      btns.forEach(b => b.classList.toggle("active", b.dataset.tab === id));

      if (id === "p2" && !f2.src) f2.src = SRC2;
      if (id === "p3" && !f3.src) f3.src = SRC3;

      // Plotly in hidden tabs often needs an explicit resize once visible
      const af = (id === "p1") ? f1 : (id === "p2") ? f2 : f3;
      requestAnimationFrame(() => requestSize(af));
    }

    btns.forEach(b => b.addEventListener("click", () => activate(b.dataset.tab)));

    // Kick off sizing for the first tab once it loads
    f1.addEventListener("load", () => requestSize(f1));
    f2.addEventListener("load", () => requestSize(f2));
    f3.addEventListener("load", () => requestSize(f3));
  </script>

</body>
</html>
