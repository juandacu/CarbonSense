      return String(um.buttons[idx].label);
    } catch (e) {
      return null;
    }
  }

  var currentYear = getActiveYearLabel();

  function updateAvgTag(scc) {
    var y = currentYear || getActiveYearLabel();
    if (!y) return;

    Plotly.relayout(gd, upd);
  }

  function applyXMax(xmax) {
    xmax = Number(xmax);

    var annPath = 'annotations[1].text';
    var update = {};

  }

  function applySCC(scc) {

    var newX = [];
    var traceIdx = [];

    for (var i = 0; i < gd.data.length; i++) {
      var tr = gd.data[i];
      if (tr.type !== 'bar') continue;

      traceIdx.push(i);
      var base = tr.customdata || [];
      var x = new Array(base.length);
