(function() {
  var gd = document.getElementById('scc_plot');

  // Insert controls above the chart
  var controls = document.createElement('div');
  controls.style.display = 'flex';
  controls.style.gap = '12px';
  controls.style.alignItems = 'center';
  controls.style.marginBottom = '10px';

  controls.innerHTML = `
    <div style="display:flex; gap:8px; align-items:center;">
      <label style="font-family: Arial, sans-serif; font-size: 14px;">SCC (€/tCO2)</label>
      <input id="scc_num" type="number" min="0" step="1" value="185.0"
             style="width:110px; padding:6px; border:1px solid #d0d0d0; border-radius:6px;" />
    </div>
    <input id="scc_slider" type="range" min="0" max="500" step="1" value="185.0"
           style="width:320px;" />
  `;

  gd.parentNode.insertBefore(controls, gd);

  var num = document.getElementById('scc_num');
  var slider = document.getElementById('scc_slider');

  function applySCC(scc) {
    scc = Number(scc);
    if (!isFinite(scc) || scc < 0) return;

    // rescale all bar traces using customdata (tCO2/€)
    var newX = [];
    var traceIdx = [];

    for (var i = 0; i < gd.data.length; i++) {
      var tr = gd.data[i];
      if (tr.type !== 'bar') continue;

      traceIdx.push(i);
      var base = tr.customdata || [];
      var x = new Array(base.length);
      for (var j = 0; j < base.length; j++) {
        var v = base[j];
        x[j] = (v === null || v === undefined) ? null : v * scc;
      }
      newX.push(x);
    }

    Plotly.restyle(gd, {'x': newX}, traceIdx);

    // keep autorange responsive
    Plotly.relayout(gd, {'xaxis.autorange': true});

    // update SCC annotation text
    var annPath = 'annotations[0].text';
    var update = {};
    update[annPath] = 'SCC = ' + Math.round(scc) + ' €/tCO2';
    Plotly.relayout(gd, update);
  }

  // sync inputs
  function syncFromNum() {
    slider.value = num.value;
    applySCC(num.value);
  }
  function syncFromSlider() {
    num.value = slider.value;
    applySCC(slider.value);
  }

  num.addEventListener('input', syncFromNum);
  slider.addEventListener('input', syncFromSlider);

  // init (ensures consistent state)
  applySCC(185.0);
})();
