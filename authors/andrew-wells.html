<script>
  (function () {
    const grid = document.getElementById("author-articles");
    if (!grid) return;

    const AUTHOR = "Andrew Wells";
    const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu, "");

    // Prefix relative assets correctly when this page lives in /authors/
    function asset(p) {
      if (!p) return "";
      if (/^https?:\/\//i.test(p)) return p;
      const needsUp = location.pathname.includes("/authors/");
      return (needsUp ? "../" : "") + String(p).replace(/^\/+/, "");
    }

    // Live filter (prevents future goLive items showing on author pages)
    const now = new Date();
    function isLive(a) {
      if (!a || !a.goLive) return true; // backwards-compatible: no goLive => treat as live
      const d = new Date(String(a.goLive) + "T00:00:00"); // stable parse of YYYY-MM-DD
      return !Number.isNaN(d.getTime()) && d <= now;
    }

    const url = "../data/articles.json?v=" + Date.now();

    fetch(url, { cache: "no-store" })
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(payload => {
        const list = Array.isArray(payload) ? payload : (payload.articles || []);

        // Support co-authored articles (`authors: [...]`) as well as legacy `author`
        const mine = list
          .filter(isLive)
          .filter(a => {
            const names = Array.isArray(a.authors) && a.authors.length
              ? a.authors.map(p => p && p.name).filter(Boolean)
              : String(a.author?.name || a.author || "")
                  .split(",")
                  .map(s => s.trim())
                  .filter(Boolean);

            return names.some(n => norm(n) === norm(AUTHOR));
          });

        grid.classList.add("article-grid");
        grid.innerHTML = mine.length
          ? mine.map(renderAuthorCard).join("")
          : '<div class="muted">No articles yet.</div>';
      })
      .catch(() => {
        grid.innerHTML = '<div class="muted">Failed to load articles.</div>';
      });

    function renderAuthorCard(a) {
      const thumb = asset(a.image || "../assets/mangrove.jpg");
      const dateText = a.date ? new Date(a.date + "T00:00:00").toDateString() : "";
      const tag   = a.tags?.[0] ? `<span class="tag">${a.tags[0]}</span>` : "";
      const read  = a.readTime ? `${a.readTime} min` : "";
      const href  = a.href || a.url || "#";

      // Fix relative link when inside /authors/
      const link = location.pathname.includes("/authors/") && href && !/^https?:\/\//.test(href)
        ? "../" + href.replace(/^\/+/, "")
        : href;

      return `
        <article class="article-card">
          <img class="article-thumb" src="${thumb}" alt="">
          <div class="article-body">
            <h3>${a.title || "Untitled"}</h3>
            <p class="article-deck">${a.deck || a.excerpt || ""}</p>
          </div>
          <div class="article-meta only-right">
            <div class="meta-right">
              ${tag}
              ${read ? `<span>${read}</span><span aria-hidden="true">•</span>` : ""}
              ${dateText ? `<time datetime="${a.date}">${dateText}</time>` : ""}
            </div>
          </div>
          <a class="cover" href="${link}">Read</a>
        </article>`;
    }
  })();
</script>
